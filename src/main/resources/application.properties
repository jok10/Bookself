spring.application.name=Bookself

# In-memory H2 database for development/skeleton purposes
spring.datasource.url=jdbc:h2:mem:bookself
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT signing secret and token lifetime (ms). 24 hours.
# This is fine for coursework with an in-memory H2 database and no real
# user data. For anything deployed with a real database, this belongs in
# an environment variable, not checked into the repo.
jwt.secret=Ecgib6EnI9hS7aMrkr8/CCh3ZEPbplNaSfwBm5klx8wW8G9gR7ZYRnXz4c3yECGfsiNQ08JAK3tu6AyIAQ/hAQ==
jwt.expiration-ms=86400000
